# Include this file inside `http { ... }` (not inside `server`).
#
# Conservative mobile detection: tablets / iPad are NOT treated as phones
# (they stay on the PC site per product decision).

map $http_user_agent $is_mobile_request {
    default 0;
    ~*ipad 0;
    ~*tablet 0;
    ~*(android.*(mobile|phone)|iphone|ipod|blackberry|bb10|iemobile|windows\s+phone|opera\s+mini|webos) 1;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

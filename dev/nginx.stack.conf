worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    map $http_user_agent $is_mobile_request {
        default 0;
        ~*ipad 0;
        ~*tablet 0;
        ~*(android.*(mobile|phone)|iphone|ipod|blackberry|bb10|iemobile|windows\s+phone|opera\s+mini|webos) 1;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 8080;
        server_name localhost;

        set $do_mobile_redirect 0;
        if ($is_mobile_request = 1) {
            set $do_mobile_redirect 1;
        }
        if ($cookie_prefer_desktop = "1") {
            set $do_mobile_redirect 0;
        }
        if ($uri ~ "^/m(/|$)") {
            set $do_mobile_redirect 0;
        }
        if ($do_mobile_redirect = 1) {
            return 302 http://$host:$server_port/m$request_uri;
        }

        location ^~ /m/ {
            proxy_pass http://host.docker.internal:3004;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_pass http://host.docker.internal:3003;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}

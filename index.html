<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AWAK - 沉浸式高级风格</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;500;700;800;900&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      document.addEventListener('DOMContentLoaded', () => {
        const io = new IntersectionObserver(entries => {
          entries.forEach(e => {
            if(e.isIntersecting){
              e.target.classList.add('visible');
              io.unobserve(e.target);
            }
          });
        }, { threshold: 0.1 });
        
        // Since React renders dynamically, we might need a MutationObserver or run this after render.
        // For static initial HTML, this works, but for React, we should probably run it via a MutationObserver on body.
        const observer = new MutationObserver(() => {
          document.querySelectorAll('.reveal:not(.observed)').forEach(el => {
            el.classList.add('observed');
            io.observe(el);
          });
        });
        observer.observe(document.body, { childList: true, subtree: true });
      });
    </script>
  </body>
</html>

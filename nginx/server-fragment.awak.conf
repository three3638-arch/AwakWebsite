# Valid inside `server { ... }` after you set `root` / TLS / `server_name`.
# Include `http-maps.awak.conf` once inside `http { }`.

set $do_mobile_redirect 0;
if ($is_mobile_request = 1) {
    set $do_mobile_redirect 1;
}
if ($cookie_prefer_desktop = "1") {
    set $do_mobile_redirect 0;
}
if ($uri ~ "^/m(/|$)") {
    set $do_mobile_redirect 0;
}
if ($uri ~ "^/okr(/|$)") {
    set $do_mobile_redirect 0;
}
if ($uri ~ "^/api(/|$)") {
    set $do_mobile_redirect 0;
}
if ($uri ~* \.(txt|png|jpe?g|gif|ico|webp|svg|css|js|woff2?|apk)$) {
    set $do_mobile_redirect 0;
}
if ($do_mobile_redirect = 1) {
    return 302 $scheme://$host/m$request_uri;
}

location ^~ /m/ {
    try_files $uri $uri/ /m/index.html;
}

# AwakOKR API — requires Node process on 127.0.0.1:3001 (see awakokr/deploy-server.sh)
location ^~ /api/ {
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location ^~ /okr/ {
    try_files $uri $uri/ /okr/index.html;
}

# Beta APK: serve logo from disk; proxy .apk to OSS so WeChat sees awakwill.com
location ^~ /apk_test/ {
    try_files $uri @apk_oss;
}

location @apk_oss {
    proxy_pass https://oss.awakwill.com;
    proxy_ssl_server_name on;
    proxy_set_header Host oss.awakwill.com;
    proxy_buffering off;
    proxy_read_timeout 300s;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location / {
    try_files $uri $uri/ /index.html;
}
